# Generates the public C header from src/ffi_c.rs.
# Do not edit the generated header; build-apple.sh regenerates it.

language = "C"
header = "// Generated by cbindgen from native/arti/src/ffi_c.rs. Do not edit.\n// Regenerate with native/arti/build-apple.sh."
include_guard = "AIRHOP_ARTI_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h"]
cpp_compat = true
documentation = true
documentation_style = "doxy"

[export]
# Export only the five public C entry points.
# Android-only JNI functions are excluded by their target cfg.
prefix = ""

[parse]
parse_deps = false

[fn]
args = "horizontal"

[enum]
prefix_with_name = true
