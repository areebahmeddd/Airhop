# Generates ios/Frameworks/arti.xcframework/*/Headers/arti.h from src/ffi.rs.
#
# The header is generated rather than hand-written because it is the one place
# where a mismatch is silent: a hand-edited signature that disagrees with the
# Rust compiles on both sides and corrupts the stack at run time. Generating it
# makes that class of bug impossible.

language = "C"
header = "// Generated by cbindgen from native/arti/src/ffi.rs. Do not edit.\n// Regenerate with native/arti/build-apple.sh."
include_guard = "AIRHOP_ARTI_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h"]
cpp_compat = true
documentation = true
documentation_style = "doxy"

[export]
# Only the five C entry points. There is no struct or enum to export: the status
# crosses as a packed integer precisely so the header carries no type whose
# layout Swift and Rust have to agree on independently. The JNI entry points are
# Android-only and must never reach a header Swift imports; cbindgen leaves them
# out on its own, because they are behind `#[cfg(target_os = "android")]`.
prefix = ""

[parse]
parse_deps = false

[fn]
args = "horizontal"

[enum]
prefix_with_name = true
