name: Release and Changelog

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pushes the version/changelog commit to main and creates the release.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate tag
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            echo "::error::This workflow must run on a tag. For a manual run, supply the 'tag' input."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist in this repository."
            exit 1
          fi
          # The version written into app.json is the tag without its leading v,
          # so the tag has to be a plain three-part version and nothing else.
          if ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${TAG}' must look like v1.2.3."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --output docs/dev/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append verification instructions
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          cat >> RELEASE_NOTES.md <<EOF

          ## Verify this download

          The APK is signed with the Airhop release key and carries SLSA build provenance from this repository.

          \`\`\`
          gh attestation verify airhop.apk --repo ${GITHUB_REPOSITORY}
          \`\`\`

          The same provenance is attached as \`airhop.apk.intoto.jsonl\` for offline checks.

          ## Verify the source

          \`airhop-${TAG}-sources.sha256\` lists the SHA-256 of every tracked file in this release.

          \`\`\`
          sha256sum -c airhop-${TAG}-sources.sha256
          git checkout ${TAG} && git status --porcelain
          \`\`\`

          The second command must print nothing. Hashes prove the listed files are unmodified; only an empty status proves no extra file was added, and the build compiles whatever is present.
          EOF

      - name: Compose release title
        id: title
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${VERSION%%.*}"
          CODENAME=$(sed -n "s/^[[:space:]]*\"${MAJOR}\":[[:space:]]*\"\([^\"]*\)\".*/\1/p" src/data/releases.ts | head -1)
          if [ -n "${CODENAME:-}" ]; then
            echo "name=${TAG} · ${CODENAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.title.outputs.name }}
          body_path: RELEASE_NOTES.md

      - name: Commit version and changelog to main
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/dev/CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.md"
          git fetch origin main
          # Force-switch to main since the changelog is already saved in RUNNER_TEMP.
          git checkout -f -B main origin/main
          cp "${RUNNER_TEMP}/CHANGELOG.md" docs/dev/CHANGELOG.md
          # Keep app.json and iOS MARKETING_VERSION in sync with the tag so version
          # reporting stays consistent. Android reads app.json at build time; iOS reads
          # MARKETING_VERSION from the Xcode project.
          sed -i -E "s/(\"version\": \")[^\"]*(\")/\1${VERSION}\2/" app.json
          grep -q "\"version\": \"${VERSION}\"" app.json
          sed -i -E "s/(MARKETING_VERSION = )[^;]*(;)/\1${VERSION}\2/" ios/Airhop.xcodeproj/project.pbxproj
          grep -q "MARKETING_VERSION = ${VERSION};" ios/Airhop.xcodeproj/project.pbxproj
          git add docs/dev/CHANGELOG.md app.json ios/Airhop.xcodeproj/project.pbxproj
          if git diff --staged --quiet; then
            echo "Version and changelog unchanged."
          else
            git commit -m "chore(release): set version and changelog for ${{ steps.resolve.outputs.tag }}"
            git push origin main
          fi

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: release
    # Attaches the built APK to the release and signs its build provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Stamp app version from tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/(\"version\": \")[^\"]*(\")/\1${VERSION}\2/" app.json
          grep -q "\"version\": \"${VERSION}\"" app.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Must match ndkVersion in android/build.gradle.
      - name: Install pinned Android NDK
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/airhop-release.keystore"
            echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/airhop-release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore decoded; the build will be signed with the release key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Falling back to the debug key. Add the four signing secrets to ship a properly signed release."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          mv android/app/build/outputs/apk/release/app-release.apk dist/airhop.apk

      - name: Attest APK build provenance
        id: attest-apk
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/airhop.apk

      - name: Stage APK provenance
        env:
          BUNDLE_PATH: ${{ steps.attest-apk.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" dist/airhop.apk.intoto.jsonl

      - name: Upload APK and provenance to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            dist/airhop.apk
            dist/airhop.apk.intoto.jsonl

      # The signed AAB is stored as a workflow artifact for Play Console upload.
      - name: Build release AAB (Google Play upload bundle)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Stage AAB
        run: |
          set -euo pipefail
          mv android/app/build/outputs/bundle/release/app-release.aab dist/airhop.aab

      # Play re-signs the bundle on upload, so this covers the uploaded file only.
      - name: Attest AAB build provenance
        id: attest-aab
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/airhop.aab

      - name: Stage AAB provenance
        env:
          BUNDLE_PATH: ${{ steps.attest-aab.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "${BUNDLE_PATH}" dist/airhop.aab.intoto.jsonl

      - name: Upload AAB and provenance as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airhop-playstore-aab
          path: |
            dist/airhop.aab
            dist/airhop.aab.intoto.jsonl
          if-no-files-found: error
          retention-days: 90

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: release
    # Attaches the SBOM to the release.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: airhop.spdx.json

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: airhop.spdx.json

  source-manifest:
    name: Publish Source Manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: release
    # Publishes SHA-256 hashes of tracked source files to verify source integrity.
    # Complements the SBOM by proving the source matches this release.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Generate source manifest
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/source-manifest.js \
            --output "airhop-${TAG}-sources.sha256" \
            --tag "${TAG}"

      - name: Attest source manifest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: airhop-${{ needs.release.outputs.tag }}-sources.sha256

      - name: Upload source manifest to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: airhop-${{ needs.release.outputs.tag }}-sources.sha256
