name: Release and Changelog

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    # Pushes the version/changelog commit to main and creates the release.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate tag
        id: resolve
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            echo "::error::This workflow must run on a tag. For a manual run, supply the 'tag' input."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist in this repository."
            exit 1
          fi
          # The version written into app.json is the tag without its leading v,
          # so the tag has to be a plain three-part version and nothing else.
          if ! printf '%s' "${TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${TAG}' must look like v1.2.3."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --output docs/dev/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --strip header --output RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose release title
        id: title
        run: |
          set -euo pipefail
          # Use the git-cliff release heading if available; otherwise fall back to the tag.
          NAME=$(grep -m1 "^## What's Changed in " RELEASE_NOTES.md | sed "s/^## What's Changed in //" || true)
          if [ -z "${NAME:-}" ]; then
            NAME="${{ steps.resolve.outputs.tag }}"
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.title.outputs.name }}
          body_path: RELEASE_NOTES.md

      - name: Commit version and changelog to main
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/dev/CHANGELOG.md "${RUNNER_TEMP}/CHANGELOG.md"
          git fetch origin main
          # The generated changelog is already safe in RUNNER_TEMP, so discard the
          # tag's working tree when switching to main. Without -f this aborts on any
          # tag that sits behind main, which is what re-publishing an older tag does.
          git checkout -f -B main origin/main
          cp "${RUNNER_TEMP}/CHANGELOG.md" docs/dev/CHANGELOG.md
          # Keep app.json and iOS MARKETING_VERSION in sync with the tag so version
          # reporting stays consistent. Android reads app.json at build time; iOS reads
          # MARKETING_VERSION from the Xcode project.
          sed -i -E "s/(\"version\": \")[^\"]*(\")/\1${VERSION}\2/" app.json
          grep -q "\"version\": \"${VERSION}\"" app.json
          sed -i -E "s/(MARKETING_VERSION = )[^;]*(;)/\1${VERSION}\2/" ios/Airhop.xcodeproj/project.pbxproj
          grep -q "MARKETING_VERSION = ${VERSION};" ios/Airhop.xcodeproj/project.pbxproj
          git add docs/dev/CHANGELOG.md app.json ios/Airhop.xcodeproj/project.pbxproj
          if git diff --staged --quiet; then
            echo "Version and changelog unchanged."
          else
            git commit -m "chore(release): set version and changelog for ${{ steps.resolve.outputs.tag }}"
            git push origin main
          fi

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    needs: release
    # Attaches the built APK to the release.
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Stamp app version from tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/(\"version\": \")[^\"]*(\")/\1${VERSION}\2/" app.json
          grep -q "\"version\": \"${VERSION}\"" app.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Must match ndkVersion in android/build.gradle.
      - name: Install pinned Android NDK
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/airhop-release.keystore"
            echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/airhop-release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore decoded; the build will be signed with the release key."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Falling back to the debug key. Add the four signing secrets to ship a properly signed release."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          set -euo pipefail
          mkdir -p dist
          mv android/app/build/outputs/apk/release/app-release.apk dist/airhop.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/airhop.apk

      # Google Play needs an AAB, not an APK. It is signed with the same upload
      # key and kept as a workflow artifact (not attached to the public release,
      # since users cannot install an AAB) for you to download and upload to the
      # Play Console.
      - name: Build release AAB (Google Play upload bundle)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB as build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: airhop-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
