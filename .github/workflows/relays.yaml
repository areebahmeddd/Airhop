name: Sync Relay Directory

on:
  schedule:
    # Updated when bitchat merges its weekly relay review.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relays
  cancel-in-progress: false

env:
  # bitchat's reviewed relay list (instead of georelays directly): georelays' daily output
  # swings ~6% on probe timeouts, while sharing this file keeps relay picks interoperable per geohash cell.
  SOURCE_REPOSITORY: https://github.com/permissionlesstech/bitchat.git
  SOURCE_PATH: relays/online_relays_gps.csv
  STALE_AFTER_DAYS: 30

jobs:
  sync:
    name: Sync from upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scope the write token to this step only.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Fetch candidate at a pinned commit
        id: upstream
        run: |
          set -euo pipefail

          source_commit=$(git ls-remote --refs "$SOURCE_REPOSITORY" refs/heads/main | awk 'NR == 1 { print $1 }')
          if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve an immutable upstream commit"
            exit 1
          fi

          source_url="https://raw.githubusercontent.com/permissionlesstech/bitchat/$source_commit/$SOURCE_PATH"
          effective_url=$(curl --fail --show-error --silent --location \
            --proto "=https" --proto-redir "=https" --tlsv1.2 \
            --max-time 60 --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/relays-candidate.csv" \
            --write-out "%{url_effective}" "$source_url")

          if [[ "$effective_url" != "$source_url" ]]; then
            echo "::error::Unexpected redirect target: $effective_url"
            exit 1
          fi

          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "url=$source_url" >> "$GITHUB_OUTPUT"

      - name: Validate candidate
        id: validation
        run: |
          node scripts/validate-relays.js \
            --input "$RUNNER_TEMP/relays-candidate.csv" \
            --baseline assets/data/relays.csv \
            --github-output "$GITHUB_OUTPUT"

      - name: Adopt candidate
        run: cp "$RUNNER_TEMP/relays-candidate.csv" assets/data/relays.csv

      - name: Regenerate relay modules
        run: node scripts/generate-relays.js

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          git add assets/data/relays.csv src/data/relays.ts landing/src/data/relays.ts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Relay directory already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.upstream.outputs.commit }}
          UNIQUE_RELAYS: ${{ steps.validation.outputs.unique_relays }}
          ADDED: ${{ steps.validation.outputs.added }}
          REMOVED: ${{ steps.validation.outputs.removed }}
          DATA_SHA256: ${{ steps.validation.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh auth setup-git

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(relays): sync relay directory from upstream" \
            -m "Upstream-commit: $SOURCE_COMMIT" \
            -m "Relays: $UNIQUE_RELAYS (+$ADDED / -$REMOVED)" \
            -m "SHA-256: $DATA_SHA256"
          git push origin HEAD:main

          {
            echo "Synced $UNIQUE_RELAYS relays (+$ADDED / -$REMOVED)."
            echo "Upstream commit: $SOURCE_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check upstream freshness
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=assets/data/relays.csv&per_page=1" \
            --jq '.[0].commit.committer.date // empty')
          if [[ -z "$last" ]]; then
            echo "No commit history for the relay directory yet."
            exit 0
          fi

          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "Relay directory last changed $age_days day(s) ago ($last)."

          if (( age_days > STALE_AFTER_DAYS )); then
            echo "::warning::Relay directory unchanged for $age_days days. Check for an unmerged automation PR: https://github.com/permissionlesstech/bitchat/pulls"
          fi
