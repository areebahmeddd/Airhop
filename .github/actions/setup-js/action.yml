name: Set up JavaScript toolchain
description: Install Node.js with npm caching and the project's locked dependencies.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci
